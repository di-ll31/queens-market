
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Queen’s Market | الصفحة الرئيسية</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="logo">Q</div>
    <nav>
      <button aria-label="الرئيسية"><i>🏠</i></button>
      <button aria-label="السلة"><i>🛒</i></button>
      <button aria-label="المفضلة"><i>♥️</i></button>
      <button aria-label="الإعدادات"><i>⚙️</i></button>
    </nav>
  </aside>

  <header>
    <div class="header-content">
      <h1>مرحباً في Queen’s Market</h1>
      <button class="btn-primary">ابدأ التسوق</button>
    </div>
  </header>

  <main>
    <section class="sections">
      <div class="section-card">
        <h2>عروض اليوم</h2>
        <p>تشكيلة مختارة بأسعار رائعة</p>
      </div>
      <div class="section-card">
        <h2>الفئات</h2>
        <p>اجتزِ إلى ما تحتاج بسرعة</p>
      </div>
      <div class="section-card">
        <h2>منتجات مميزة</h2>
        <p>اختيارات مميزة لك</p>
      </div>
    </section>

    <section class="featured-products">
      <h2>منتجات مميزة</h2>
      <div class="grid">
        <div class="prod-card">
          <img src="https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?auto=format&fit=crop&w=400&q=80" alt="فراولة طازجة"/>
          <h3>فراولة طازجة</h3>
          <span>⭐️ 4.7 — $4.99</span>
        </div>
        <div class="prod-card">
          <img src="https://images.unsplash.com/photo-1506801310323-534be5e7a6b1?auto=format&fit=crop&w=400&q=80" alt="تفاح"/>
          <h3>تفاح عضوي</h3>
          <span>⭐️ 4.5 — $3.99</span>
        </div>
        <div class="prod-card">
          <img src="https://images.unsplash.com/photo-1511688878356-f8d60f8762be?auto=format&fit=crop&w=400&q=80" alt="موز"/>
          <h3>موز ناضج</h3>
          <span>⭐️ 4.8 — $2.99</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
