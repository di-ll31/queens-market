<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search Results - Queen's Supermarket Guide</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Sidebar with categories -->
    <nav id="sidebar" class="sidebar expanded">
      <div class="logo-container">
        <img src="queens-logo.png" alt="Queen's Logo" class="logo" />
      </div>
      <button id="toggleSidebar" class="toggle-btn" aria-label="Toggle Categories">
        ☰
      </button>
      <ul class="categories-list">
        <li><a href="categories.html">All Items</a></li>
        <li><a href="categories.html#fresh-produce">Fresh Produce</a></li>
        <li><a href="categories.html#dairy-eggs">Dairy & Eggs</a></li>
        <li><a href="categories.html#meat-seafood">Meat & Seafood</a></li>
        <li><a href="categories.html#bakery">Bakery</a></li>
        <li><a href="categories.html#beverages">Beverages</a></li>
        <li><a href="categories.html#snacks-candy">Snacks & Candy</a></li>
        <li><a href="categories.html#frozen-foods">Frozen Foods</a></li>
        <li><a href="categories.html#household-supplies">Household Supplies</a></li>
        <li><a href="categories.html#personal-care">Personal Care</a></li>
        <li><a href="categories.html#baby-products">Baby Products</a></li>
        <li><a href="categories.html#organic-health">Organic & Health Foods</a></li>
        <li><a href="categories.html#international-foods">International Foods</a></li>
      </ul>
    </nav>

    <!-- Main content -->
    <main class="main-content">
      <header class="header">
        <h1>Search Results</h1>
        <p id="searchQueryText"></p>

        <div class="sort-options">
          <label for="sortSelect">Sort by:</label>
          <select id="sortSelect" name="sort">
            <option value="best-selling">Best Selling</option>
            <option value="price-low-high">Price: Low to High</option>
            <option value="price-high-low">Price: High to Low</option>
            <option value="best-reviewed">Best Reviewed</option>
          </select>
        </div>
      </header>

      <section id="productsList" class="products-list">
        <!-- Product cards will be inserted here dynamically -->
      </section>
    </main>
  </div>

  <!-- Product detail modal -->
  <div id="productModal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
    <div class="modal-content">
      <button id="modalCloseBtn" class="modal-close" aria-label="Close product details">&times;</button>
      <div class="modal-body">
        <img id="modalProductImage" src="" alt="" />
        <div class="modal-info">
          <h2 id="modalTitle"></h2>
          <p class="category" id="modalCategory"></p>
          <p class="description" id="modalDescription"></p>
          <p class="reviews" id="modalReviews"></p>
          <p class="aisle" id="modalAisle"></p>
          <div id="modalMap" class="store-map">
            <!-- Placeholder for store map image or interactive map -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
