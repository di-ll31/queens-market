<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Search Results - Queen's Supermarket</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="main-nav">
      <img src="download.jpg" alt="Queen's Logo" />
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="#products">Products</a></li>
        <li><a href="#about">About Us</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="search-results">
    <div class="container">
      <h1>Search Results for: <span id="searchTerm"></span></h1>
      <div id="productList" class="product-carousel"></div>
    </div>
  </section>

  <!-- Product Modal -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle"></h2>
      <img id="modalImage" src="" alt="">
      <p id="modalDesc"></p>
      <p id="modalStars"></p>
      <p id="modalPrice"></p>
      <p id="modalAisle"></p>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <div class="footer-section">
        <h3>Quick Links</h3>
        <ul>
          <li><a href="#about">About Us</a></li>
          <li><a href="#careers">Careers</a></li>
          <li><a href="#privacy">Privacy Policy</a></li>
          <li><a href="#terms">Terms of Service</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h3>Connect With Us</h3>
        <div class="social-links">
          <a href="#facebook">Facebook</a>
          <a href="#instagram">Instagram</a>
          <a href="#twitter">Twitter</a>
        </div>
      </div>
    </div>
    <p class="copyright">&copy; 2025 Queen's Supermarket. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
